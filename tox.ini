[tox]
# Default environments run by a bare `tox` invocation.
envlist = py311, lint, type
isolated_build = True
skip_missing_interpreters = True

[testenv]
# Test runner. Installs the package with its dev extras and runs pytest.
description = Run the test suite
extras = dev
passenv =
    CNF_*
    OS_*
setenv =
    # The etcd3 package ships protobuf stubs the C++ runtime rejects; the pure
    # Python parser loads them. Matches the runtime container (see Dockerfile).
    PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION = python
commands =
    python -m grpc_tools.protoc -I proto --python_out=cnf/grpc --grpc_python_out=cnf/grpc proto/cnf.proto
    pytest {posargs}

[testenv:lint]
description = Lint with ruff
skip_install = True
deps = ruff>=0.3.0
commands = ruff check cnf tests

[testenv:format]
description = Auto-format with black and apply ruff fixes
skip_install = True
deps =
    black>=24.0.0
    ruff>=0.3.0
commands =
    black cnf tests
    ruff check --fix cnf tests

[testenv:type]
description = Static type checking with mypy
extras = dev
setenv =
    PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION = python
commands =
    python -m grpc_tools.protoc -I proto --python_out=cnf/grpc --grpc_python_out=cnf/grpc proto/cnf.proto
    mypy cnf

[testenv:coverage]
description = Run tests with an HTML coverage report
extras = dev
setenv =
    PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION = python
commands =
    python -m grpc_tools.protoc -I proto --python_out=cnf/grpc --grpc_python_out=cnf/grpc proto/cnf.proto
    pytest --cov=cnf --cov-report=term-missing --cov-report=html {posargs}
