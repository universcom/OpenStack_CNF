---
# deploy/ansible/roles/cnf/tasks/main.yml
# Deploys CNF agent as a container on each OpenStack controller node.
# Host still provides: FRR (BGP), libvirt, Ceph client config — the container
# binds to those via host networking and bind-mounts.

- name: Install host-side dependencies (FRR + container runtime prerequisites)
  ansible.builtin.package:
    name:
      - frr
      - ca-certificates
      - curl
      - python3
    state: present

- name: Install Docker engine
  ansible.builtin.package:
    name:
      - docker.io
      - python3-docker
    state: present
  when: cnf_install_docker | default(true) | bool

- name: Ensure Docker service is running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Ensure FRR is running (required for BGP IP portability)
  ansible.builtin.systemd:
    name: frr
    state: started
    enabled: true

- name: Create cnf system user (owns config + state dirs on the host)
  ansible.builtin.user:
    name: cnf
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/cnf
    create_home: true

- name: Create CNF host directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: cnf
    group: cnf
    mode: "0750"
  loop:
    - /etc/cnf
    - /etc/cnf/tls
    - /var/log/cnf
    - /var/lib/cnf

- name: Deploy CNF configuration
  ansible.builtin.template:
    src: cnf.yaml.j2
    dest: /etc/cnf/cnf.yaml
    owner: cnf
    group: cnf
    mode: "0640"
  notify: Restart CNF agent

- name: Deploy TLS certificates
  ansible.builtin.copy:
    content: "{{ item.content }}"
    dest: "/etc/cnf/tls/{{ item.name }}"
    owner: cnf
    group: cnf
    mode: "0640"
  loop:
    - { name: "ca.crt",     content: "{{ cnf_tls_ca }}" }
    - { name: "server.crt", content: "{{ cnf_tls_cert }}" }
    - { name: "server.key", content: "{{ cnf_tls_key }}" }
  no_log: true
  notify: Restart CNF agent

- name: Log in to container registry
  community.docker.docker_login:
    registry_url: "{{ cnf_image_registry }}"
    username: "{{ cnf_image_registry_user }}"
    password: "{{ cnf_image_registry_password }}"
  when:
    - cnf_image_registry is defined
    - cnf_image_registry_user is defined
  no_log: true

- name: Pull CNF container image
  community.docker.docker_image:
    name: "{{ cnf_image }}:{{ cnf_image_tag | default(cnf_version | default('0.1.0')) }}"
    source: pull
    force_source: "{{ cnf_image_force_pull | default(false) | bool }}"

- name: Run CNF agent container
  community.docker.docker_container:
    name: "{{ cnf_container_name | default('cnf-agent') }}"
    image: "{{ cnf_image }}:{{ cnf_image_tag | default(cnf_version | default('0.1.0')) }}"
    state: started
    restart_policy: unless-stopped
    # Host networking: required for BGP via host's FRR, libvirt live-migration
    # tunnels, and to expose REST :8080, gRPC :50051, metrics :9090 on the
    # controller's real IP without port-mapping gymnastics.
    network_mode: host
    pid_mode: host
    capabilities:
      - NET_ADMIN
      - SYS_PTRACE
    volumes:
      - /etc/cnf:/etc/cnf:ro
      - /etc/ceph:/etc/ceph:ro
      - /var/log/cnf:/var/log/cnf:rw
      - /var/lib/cnf:/var/lib/cnf:rw
      - /var/run/libvirt:/var/run/libvirt:rw
      - /var/run/frr:/var/run/frr:rw
    env:
      CNF_CONFIG: /etc/cnf/cnf.yaml
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      app: cnf-agent
      cluster: "{{ cnf_cluster_name }}"

- name: Register CNF as OpenStack service
  openstack.cloud.catalog:
    name: cnf
    service_type: cnf
    description: "Cluster Nova Federation"
    state: present
  delegate_to: "{{ groups['controllers'][0] }}"
  run_once: true

- name: Create CNF endpoint
  openstack.cloud.endpoint:
    service: cnf
    endpoint_interface: "{{ item }}"
    url: "http://{{ ansible_host }}:8080/v1"
    region: "{{ openstack_region | default('RegionOne') }}"
    state: present
  loop: [public, internal, admin]
  delegate_to: "{{ groups['controllers'][0] }}"
  run_once: true

- name: Wait for CNF API to become healthy
  ansible.builtin.uri:
    url: "http://localhost:8080/healthz"
    status_code: 200
  register: health_check
  until: health_check.status == 200
  retries: 12
  delay: 5
